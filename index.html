    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme:dark)').matches);
          // delphicanon tokens follow prefers-color-scheme unless html.light is set
          document.documentElement.classList.add(dark ? 'dark' : 'light');
          if (localStorage.getItem('font') === 'classic') document.documentElement.classList.add('classic');
        } catch (e) {}
      })();
    </script>
